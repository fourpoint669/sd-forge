  { name = "peak_used_days_supply", var = "used days supply", stat = "max" }
]

# Objective for the policy ranking: cumulative net profit before tax at month 60 (all lenses use it; lens B reads min_net_profit, lens D cum_dcf_m120).
# "baseline store" is listed FIRST: gains are measured per sample against it (gate 4 decision).
[policy]
objective = "cum_profit_m60"
maximize = true

[[policies]]
name = "baseline store (no lever change)"

[[policies]]
name = "A used inventory +33 days supply (about $10k a month of carrying cost)"
changes = { "target used days supply" = { add = 33 } }

[[policies]]
name = "A technicians +1.7 (about $10k a month of payroll)"
changes = { "technician target" = { add = 1.7 } }

[[policies]]
name = "A F and I programme +$10k a month"
changes = { "F and I programme spend" = { set = 10000 } }

[[policies]]
name = "A marketing +$10k a month"
changes = { "marketing spend" = { add = 10000 } }

[[policies]]
name = "B new-vehicle gross -30% for 12 months"
changes = { "margin shock size" = { set = 0.3 } }

[[policies]]
name = "B floorplan rate +3 points for 12 months"
changes = { "rate shock size" = { set = 0.03 } }

[[policies]]
name = "B demand -20% for 12 months"
changes = { "demand shock size" = { set = 0.2 } }

[[policies]]
name = "B all three shocks together, 12 months"
changes = { "margin shock size" = { set = 0.3 }, "rate shock size" = { set = 0.03 }, "demand shock size" = { set = 0.2 } }

[[policies]]
name = "B new-vehicle gross -30% for 24 months"
changes = { "margin shock size" = { set = 0.3 }, "shock duration" = { set = 24 } }

[[policies]]
name = "C used-heavy mix (new share 0.45, used days supply +15)"
changes = { "new share of shoppers" = { set = 0.45 }, "target used days supply" = { add = 15 } }

[[policies]]
name = "C lease-heavy mix (lease share 0.40)"
changes = { "lease share" = { set = 0.4 } }

[[policies]]
name = "C fixed-ops: technicians +3 only (capacity, no extra demand)"
changes = { "technician target" = { add = 3 } }

[[policies]]
name = "C fixed-ops: service capture x1.25 only (costs nothing in the model: an upper bound)"
changes = { "service capture share" = { mul = 1.25 } }

[[policies]]
name = "C fixed-ops-heavy mix (both of the above)"
changes = { "service capture share" = { mul = 1.25 }, "technician target" = { add = 3 } }

