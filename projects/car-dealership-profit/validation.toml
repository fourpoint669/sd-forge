"new vehicles" = ["New Inventory", "New Vehicles On Order", "Manufacturer Supply Outside", "New Vehicles Sold", "new sales", "new orders", "deliveries", "target new inventory", "target new days supply", "new inventory adjustment time", "order lead time", "manufacturer allocation", "allocation response", "allocation response strength", "Trailing New Sales", "trailing change", "allocation memory", "availability constant new", "reference new sales", "initial new inventory", "initial new vehicles on order"]
"used vehicles" = ["Used Frontline Inventory", "Reconditioning Pipeline", "Used Vehicle Supply Outside", "Used Vehicles Sold On", "Trailing Used Sales", "trailing used change", "used sales memory", "reference used sales", "used sales", "used acquisitions", "trade ins", "off lease returns", "auction buys", "recon done", "wholesale exits", "used days supply", "used price discount", "target used inventory", "target used days supply", "used inventory adjustment time", "reconditioning time", "wholesale exit rate", "wholesale exit rate monthly", "trade in share", "off lease return share", "availability constant used", "discount demand sensitivity", "discount sensitivity", "maximum price discount", "minimum used sales rate", "minimum sellout time", "initial used supply outside", "initial used frontline inventory", "initial reconditioning pipeline"]
"customer base and leases" = ["Owners", "Lessees Early", "Lessees Mid", "Lessees Late", "Households Elsewhere", "retail new buys", "lease starts", "lease advance 1", "lease advance 2", "lease end", "lease stage time", "replacement", "leakage", "lease share", "lease term", "number of lease stages", "ownership period", "initial owners", "initial lessees per stage"]
