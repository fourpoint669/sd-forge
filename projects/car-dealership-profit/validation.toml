# T8 reads link signs with parameters A and C switched on (inside their ranges), so the two loops through them get a polarity;
# their bases stay 0. Scores and dominance still come from the true base run (gate 3, option a).
[loop_check]
set = { "allocation response strength" = 0.4, "retention loss when overloaded" = 0.3, "attrition rate" = 0.35 }

[[conservation]]
name = "households (closed market plus source and sink)"
stocks = ["Households Outside Market", "Prospects", "Owners", "Lessees Early", "Lessees Mid", "Lessees Late", "Households Elsewhere"]

[[conservation]]
name = "new vehicles (manufacturer source to sold)"
stocks = ["Manufacturer Supply Outside", "New Vehicles On Order", "New Inventory", "New Vehicles Sold"]

[[conservation]]
name = "used vehicles (outside supply to sold on)"
stocks = ["Used Vehicle Supply Outside", "Reconditioning Pipeline", "Used Frontline Inventory", "Used Vehicles Sold On"]

[[extreme]]
name = "nobody shops: no sales, owners only replace"
set = { "shopping rate" = 0 }
expect = [{ var = "new sales", stat = "max", op = "<=", value = 1e-9 },
          { var = "used sales", stat = "max", op = "<=", value = 1e-9 },
          { var = "Owners", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "no leases: no lease starts, lessees run off"
set = { "lease share" = 0 }
expect = [{ var = "lease starts", stat = "max", op = "<=", value = 1e-9 },
          { var = "Lessees Late", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "no service capture: service customers only defect"
set = { "service capture share" = 0 }
expect = [{ var = "Service Customers", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "no technician target: headcount only falls"
set = { "technician target" = 0 }
expect = [{ var = "Technicians", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "F and I off: no F and I income"
set = { "F and I base penetration" = 0, "F and I maximum penetration uplift" = 0 }
expect = [{ var = "F and I income", stat = "max", op = "<=", value = 1e-9 }]

[[extreme]]
name = "no manufacturer allocation: no new orders"
set = { "manufacturer allocation" = 0 }
expect = [{ var = "new orders", stat = "max", op = "<=", value = 1e-9 },
          { var = "New Vehicles On Order", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "no wholesaling: no exits"
set = { "wholesale exit rate" = 0 }
expect = [{ var = "wholesale exits", stat = "max", op = "<=", value = 1e-9 }]

[[extreme]]
name = "no demand sources: outside market and marketing off"
set = { "market entry rate" = 0, "maximum marketing starts" = 0 }
expect = [{ var = "Households Outside Market", stat = "max", op = "<=", value = 1e-9 }]

# shock window is months 24-36 (shock start month 24, duration 12), so month 30 is inside it
[[extreme]]
name = "margin squeeze to zero: new gross is zero inside the window"
set = { "margin shock size" = 1 }
expect = [{ var = "new gross", stat = "value_at", time = 30, op = "<=", value = 1e-9 }]

# base interest is about 55,000 a month (settled debt 9.5M x 7%/12); +0.10/yr gives about 135,000
[[extreme]]
name = "rate shock of 10 points: floorplan interest more than doubles inside the window"
set = { "rate shock size" = 0.1 }
expect = [{ var = "floorplan interest", stat = "value_at", time = 30, op = ">=", value = 120000 }]

[[extreme]]
name = "demand shock of 100%: no shoppers inside the window"
set = { "demand shock size" = 1 }
expect = [{ var = "shoppers", stat = "value_at", time = 30, op = "<=", value = 1e-9 }]

[[extreme]]
name = "maximum overload sensitivity with few technicians: stocks stay non-negative"
set = { "retention loss when overloaded" = 1, "technician target" = 5 }
expect = [{ var = "Service Customers", stat = "min", op = ">=", value = 0 }]

[[extreme]]
name = "extreme discount response: demand stays positive"
set = { "discount demand sensitivity" = 3, "discount sensitivity" = 0.3 }
expect = [{ var = "used demand", stat = "min", op = ">=", value = 0 }]

# T5 limit case: constant new-vehicle demand with a huge prospect pool, no allocation cap, no response, availability = 1.
# Then d(New Inventory + New Vehicles On Order)/dt = (target - stock)/adjustment time exactly (deliveries cancel), whatever the
# lead time, so the stock follows the goal-seeking closed form  G + (y0 - G) exp(-t/tau)  with
#   G = N x (target new days supply / days per month + order lead time) = 80 x (60/30.4 + 1) = 237.8947...
#   y0 = initial new inventory + initial new vehicles on order = 40 + 0, tau = new inventory adjustment time.
# N = initial prospects x shopping rate / months per year x new share of shoppers = 1e9 x 1.7454545e-6 / 12 x 0.55 = 80.
# The prospect pool loses 80 x 180 = 14,400 households of 1e9 (1.4e-5 relative), so demand is constant to that precision.
[reference]
function = "goal_seeking"
compare = ["New Inventory", "New Vehicles On Order"]
set = { "initial prospects" = 1e9, "shopping rate" = 1.7454545454545454e-6, "availability constant new" = 1e-6, "manufacturer allocation" = 1e6, "allocation response strength" = 0, "market entry rate" = 0, "maximum marketing starts" = 0, "initial new inventory" = 40, "initial new vehicles on order" = 0 }
time_step = 0.0625
args = { G = 237.89473684210526, y0 = 40, tau = { param = "new inventory adjustment time" } }
nrmse_max = 0.10
# Base run: the store starts settled, so only profit accumulation moves; declared mode for the cumulative profit is growth.
modes = [{ var = "Cumulative Net Profit", mode = "growth" }]

