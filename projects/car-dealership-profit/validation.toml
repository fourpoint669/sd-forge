# Validation spec for engine/validate.py. Parameter sources and confidence tags: assumptions_register.md.
# Base parameter set = the baseline store with every engine on (gate 3 condition 2); lens scenarios are [[policies]].
# Initial stocks are fixed constants set from settled_initial.json (settle.py) and are not sampled.
# [reference] uses the analytic function "goal_seeking", which does not exist in engine/validate.py yet: it needs
# the user's approval (a one-line addition to ANALYTIC, a test and a line in library/validation_tests.md).
dominance_min_period = 1.0
# "retention loss when overloaded" is 0 in the base case and sits on a link in every one of the model's loops, so at
# base every loop score is 0, every relative score is NaN, and the explorer's loop-strength view is empty. Measured on
# the built page: raising it alone draws 64 of the 67 loops; raising "allocation response strength" (also 0 at base)
# as well draws 65; raising that one alone changes nothing. Declared here because T8 refuses to ship an empty
# loop-strength view silently; the base case is deliberate, not an oversight.
dominance_empty_at_base = "retention loss when overloaded is 0 in the base case and sits on a link in every loop, so no loop carries a score; raise it to see loop strength (allocation response strength, also 0 at base, adds one more loop but on its own changes nothing)"

