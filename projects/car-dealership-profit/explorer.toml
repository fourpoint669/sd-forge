# sd-explorer page settings. Generated by engine/explorer_config.py with defaults (no questions asked);
# edit and rebuild (python -I engine/build_explorer.py <project dir>) to change the page.
# Every name must exist in validation.toml: metrics in [montecarlo].metrics, variables in the model.

[decision]
metric = "cum_profit_m60"
maximize = true
headline = ["cum_profit_m60", "net_profit_m60", "cash_m60", "service_gross_m60"]

[[charts]]
id = "outcome"
kind = "outcome"
title = "Cumulative Net Profit over time"
open = true
vars = ["Cumulative Net Profit"]

[[charts]]
id = "key"
kind = "grid"
title = "Key outputs"
open = true
vars = ["net profit", "New Inventory", "Used Frontline Inventory", "Service Customers", "absorption rate", "Owners"]

[[charts]]
id = "sector:demand and prospects"
kind = "grid"
title = "demand and prospects"
open = false
vars = ["Households Outside Market", "market entries", "marketing starts", "Prospects", "repeat to store"]

[[charts]]
id = "sector:new vehicles"
kind = "grid"
title = "new vehicles"
open = false
vars = ["deliveries", "Manufacturer Supply Outside", "new orders", "new sales", "New Vehicles On Order", "New Vehicles Sold", "trailing change", "Trailing New Sales"]

[[charts]]
id = "sector:used vehicles"
kind = "grid"
title = "used vehicles"
open = false
vars = ["recon done", "Reconditioning Pipeline", "trailing used change", "Trailing Used Sales", "used acquisitions", "used sales", "Used Vehicle Supply Outside", "Used Vehicles Sold On", "wholesale exits"]

[[charts]]
id = "sector:customer base and leases"
kind = "grid"
title = "customer base and leases"
open = false
vars = ["Households Elsewhere", "leakage", "lease advance 1", "lease advance 2", "lease end", "lease starts", "Lessees Early", "Lessees Late", "Lessees Mid", "replacement", "retail new buys"]

[[charts]]
id = "sector:service and parts"
kind = "grid"
title = "service and parts"
open = false
vars = ["attrition", "defection", "hiring", "service capture", "Technicians"]

[[charts]]
id = "sector:financing"
kind = "grid"
title = "financing"
open = false
vars = ["Floorplan Debt", "floorplan payoff", "Inventory at Cost", "inventory cost released"]

[[charts]]
id = "sector:profit and cost"
kind = "grid"
title = "profit and cost"
open = false
vars = ["Cash Paid Out", "Cash Received", "Cumulative Loss Incurred", "Cumulative Profit Earned", "net cash flow"]

[[charts]]
id = "sector:valuation"
kind = "grid"
title = "valuation"
open = false
vars = ["Cumulative Discounted Cash Paid", "Cumulative Discounted Cash Received", "discounted net cash flow"]
