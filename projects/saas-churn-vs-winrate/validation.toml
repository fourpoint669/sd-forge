# Validation spec for engine/validate.py. Parameter sources and confidence tags: assumptions_register.md.
# Base parameter set = 50/50 split of the budget (gate 3: every loop active in the base run).
dominance_min_period = 1.0

[model]
name = "saas-churn-vs-winrate"
mdl = "model/saas_churn_vs_winrate.mdl"
py = "model/saas_churn_vs_winrate.py"
time_unit = "Month"
final_time = 120
time_step = 0.25
saveper = 1
key_outputs = ["ARR", "Customers", "customer share", "Cumulative Revenue", "Firms in Evaluation", "evaluation starts"]

# role: time_constant -> low end in the fastest corner (T4); rate -> high end.
# ---- customer engine (same base and range as projects/bass-b2b-adoption) ----
[parameters."marketing reach rate"]
base = 0.14
low = 0.05
high = 0.25
distribution = "triangular"
domain = [0, inf]
role = "rate"
unit = "1/Year"
confidence = "estimated"

[parameters."word of mouth rate"]
base = 1.8
low = 1.0
high = 2.9
distribution = "triangular"
domain = [0, inf]
role = "rate"
unit = "1/Year"
confidence = "estimated"

[parameters."sales cycle time"]
base = 6
low = 3
high = 9
distribution = "triangular"
domain = [0.5, inf]
role = "time_constant"
unit = "Month"
confidence = "reported"

# domain capped at 0.9 so that base win rate + maximum uplift (domain <= 0.1) never exceeds 1
[parameters."base win rate"]
base = 0.21
low = 0.15
high = 0.30
distribution = "triangular"
domain = [0, 0.9]
role = "rate"
unit = "Dmnl"
confidence = "reported"

[parameters."base annual churn rate"]
base = 0.08
low = 0.05
high = 0.20
distribution = "triangular"
domain = [0, inf]
role = "rate"
unit = "1/Year"
confidence = "reported"

[parameters."cool off time"]
base = 18
low = 12
high = 36
distribution = "triangular"
domain = [0.5, inf]
role = "time_constant"
unit = "Month"
confidence = "estimated"

[parameters."initial total market"]
base = 5000
low = 3000
high = 8000
distribution = "triangular"
domain = [100, inf]
unit = "Firm"
confidence = "estimated"

[parameters."initial customers"]
base = 10
low = 5
high = 25
distribution = "triangular"
domain = [0, 100]
unit = "Firm"
confidence = "estimated"

# ---- revenue ----
[parameters."new customer ACV"]
base = 30000
low = 15000
high = 60000
distribution = "triangular"
domain = [1, inf]
unit = "USD/(Firm*Year)"
confidence = "reported"

[parameters."base net expansion rate"]
base = 0.09
low = 0.02
high = 0.20
distribution = "triangular"
domain = [-0.5, 1]
role = "rate"
unit = "1/Year"
confidence = "estimated"

# average ARR per customer can rise at most to this multiple of new-customer ACV (expansion ceiling)
[parameters."expansion ceiling multiple"]
base = 2.0
low = 1.3
high = 4.0
distribution = "triangular"
domain = [1, 20]
unit = "Dmnl"
confidence = "estimated"

# ---- sales capacity ----
[parameters."initial sales capacity"]
base = 45
low = 20
high = 120
distribution = "triangular"
domain = [1, inf]
unit = "Firm/Month"
confidence = "estimated"

# ---- budget (scenario levers are fixed: they change only through [[policies]]) ----
[parameters."total programme budget"]
base = 3000000
low = 1500000
high = 6000000
distribution = "triangular"
domain = [0, inf]
unit = "USD"
confidence = "estimated"

[parameters."phase switch month"]
base = 24
low = 24
high = 24
distribution = "fixed"
domain = [0, 60]
unit = "Month"
confidence = "verified"

[parameters."churn share phase 1"]
base = 0.5
low = 0.5
high = 0.5
distribution = "fixed"
domain = [0, 1]
unit = "Dmnl"
confidence = "verified"

[parameters."churn share phase 2"]
base = 0.5
low = 0.5
high = 0.5
distribution = "fixed"
domain = [0, 1]
unit = "Dmnl"
confidence = "verified"

# ---- churn programme response ----
[parameters."CS cost per covered firm"]
base = 185
low = 100
high = 380
distribution = "triangular"
domain = [1, inf]
unit = "USD/(Firm*Month)"
confidence = "reported"

[parameters."CS ramp up time"]
base = 4
low = 2
high = 9
distribution = "triangular"
domain = [0.5, inf]
role = "time_constant"
unit = "Month"
confidence = "estimated"

[parameters."coverage scale"]
base = 0.5
low = 0.25
high = 1.0
distribution = "triangular"
domain = [0.01, inf]
unit = "Dmnl"
confidence = "estimated"

[parameters."maximum churn reduction"]
base = 0.25
low = 0.05
high = 0.45
distribution = "triangular"
domain = [0, 1]
unit = "Dmnl"
confidence = "estimated"

# ---- win-rate programme response ----
[parameters."win spend scale"]
base = 25000
low = 10000
high = 60000
distribution = "triangular"
domain = [100, inf]
unit = "USD/Month"
confidence = "estimated"

[parameters."enablement ramp up time"]
base = 6
low = 3
high = 12
distribution = "triangular"
domain = [0.5, inf]
role = "time_constant"
unit = "Month"
confidence = "estimated"

[parameters."maximum win rate uplift"]
base = 0.06
low = 0.02
high = 0.10
distribution = "triangular"
domain = [0, 0.1]
unit = "Dmnl"
confidence = "reported"

# ---- optional sensitivity parameters A, B, C and market growth (default 0, gate 2) ----
[parameters."expansion lift at full CS effect"]
base = 0
low = 0
high = 0.10
distribution = "triangular"
domain = [0, 1]
role = "rate"
unit = "1/Year"
confidence = "estimated"

[parameters."sales capacity growth rate"]
base = 0
low = 0
high = 0.5
distribution = "triangular"
domain = [0, 2]
role = "rate"
unit = "1/Year"
confidence = "estimated"

[parameters."negative word of mouth multiplier"]
base = 0
low = 0
high = 2
distribution = "triangular"
domain = [0, 10]
unit = "Dmnl"
confidence = "estimated"

[parameters."market growth rate"]
base = 0
low = 0
high = 0.10
distribution = "triangular"
domain = [0, 1]
role = "rate"
unit = "1/Year"
confidence = "estimated"

[parameters."detractor memory time"]
base = 12
low = 6
high = 24
distribution = "triangular"
domain = [0.5, inf]
role = "time_constant"
unit = "Month"
confidence = "estimated"

# T8 reads link signs with C switched on (inside its [0, 2] range), so B12 and B13 get a polarity; C's base stays 0.
# Scores and dominance still come from the true base run (gate 3, option a).
[loop_check]
set = { "negative word of mouth multiplier" = 1.0 }

[[conservation]]
name = "firms (closed market plus market-growth source)"
stocks = ["Potential Customers", "Firms in Evaluation", "Customers", "Cooling Off Firms", "Firms Yet To Enter"]

[[extreme]]
name = "no demand generation: no evaluations, customers only churn"
set = { "marketing reach rate" = 0, "word of mouth rate" = 0 }
expect = [{ var = "evaluation starts", stat = "max", op = "<=", value = 1e-9 },
          { var = "Customers", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "no launch customers and no marketing: nobody ever adopts, no ARR"
set = { "initial customers" = 0, "marketing reach rate" = 0 }
expect = [{ var = "Customers", stat = "max", op = "<=", value = 1e-9 },
          { var = "ARR", stat = "max", op = "<=", value = 1e-9 }]

[[extreme]]
name = "never win a deal even with enablement: customers only churn"
set = { "base win rate" = 0, "maximum win rate uplift" = 0 }
expect = [{ var = "Customers", stat = "monotone_nonincreasing" }]

[[extreme]]
name = "no churn: customers never decline"
set = { "base annual churn rate" = 0 }
expect = [{ var = "Customers", stat = "monotone_nondecreasing" }]

[[extreme]]
name = "near-certain wins, no churn, fast word of mouth, ample capacity: customers fill the market"
set = { "base win rate" = 0.9, "maximum win rate uplift" = 0.1, "base annual churn rate" = 0, "word of mouth rate" = 29, "initial sales capacity" = 1000000 }
expect = [{ var = "customer share", stat = "max", op = "<=", value = 1.0 },
          { var = "customer share", stat = "final", op = ">=", value = 0.9 }]

[[extreme]]
name = "zero budget: no spend, no programme capability"
set = { "total programme budget" = 0 }
expect = [{ var = "Cumulative Programme Spend", stat = "max", op = "<=", value = 1e-9 },
          { var = "CS Capacity", stat = "max", op = "<=", value = 1e-9 },
          { var = "Win Rate Capability", stat = "max", op = "<=", value = 1e-9 }]

# money conservation: the whole budget is spent by month 60 (base budget 3,000,000 USD), and nothing after
[[extreme]]
name = "budget spent exactly: cumulative spend at the end equals the total budget"
set = { "total programme budget" = 3000000 }
expect = [{ var = "Cumulative Programme Spend", stat = "final", op = "==", value = 3000000 },
          { var = "Cumulative Programme Spend", stat = "value_at", time = 60, op = "==", value = 3000000 }]

[[extreme]]
name = "expansion ceiling holds: average ARR per customer never exceeds ceiling x ACV (2 x 30,000)"
set = { "expansion ceiling multiple" = 2, "base net expansion rate" = 1 }
expect = [{ var = "ARR per customer", stat = "max", op = "<=", value = 60000.00006 }]

[[extreme]]
name = "ceiling multiple 1: no room to expand, ARR per customer stays at ACV"
set = { "expansion ceiling multiple" = 1 }
expect = [{ var = "ARR per customer", stat = "max", op = "<=", value = 30000.00003 }]

[[extreme]]
name = "tiny sales capacity: deal closings never exceed it"
set = { "initial sales capacity" = 1, "sales capacity growth rate" = 0 }
expect = [{ var = "deal closings", stat = "max", op = "<=", value = 1.000000001 }]

# linear market growth for 120 months: 5,000 x (1 + 0.10 x 10) = 10,000 firms, source exactly emptied
[[extreme]]
name = "market growth 10%/yr: total market doubles linearly over 10 years"
set = { "market growth rate" = 0.10 }
expect = [{ var = "total market", stat = "final", op = "==", value = 10000 },
          { var = "Firms Yet To Enter", stat = "final", op = "<=", value = 1e-6 }]

[[extreme]]
name = "strong negative word of mouth: word-of-mouth starts never negative"
set = { "negative word of mouth multiplier" = 10, "base annual churn rate" = 0.2 }
expect = [{ var = "word of mouth starts", stat = "min", op = ">=", value = 0 }]

# T5: same limit case as projects/bass-b2b-adoption (see its t5_audit.md): no churn, every deal won, near-instant
# sales cycle, no launch customers, plus no programme, no uplift and non-binding capacity, so the model collapses to
# classic Bass. Peak rule: 5 steps of this run's own dt = 5 x 0.01 = 0.05 months.
[reference]
function = "bass"
compare = ["Firms in Evaluation", "Customers"]
set = { "base annual churn rate" = 0, "base win rate" = 1, "maximum win rate uplift" = 0, "total programme budget" = 0, "sales cycle time" = 0.01, "initial customers" = 0, "initial sales capacity" = 1000000000 }
time_step = 0.01
args = { p = { param = "marketing reach rate", factor = 0.08333333333333333 }, q = { param = "word of mouth rate", factor = 0.08333333333333333 }, N = { param = "initial total market" } }
nrmse_max = 0.10
peak = { var = "evaluation starts", tolerance = 0.05 }
# ARR is not given a declared mode (amendment to gate 1, 2026-10-29, before any run): ARR = Customers x average ARR per
# customer, and the per-customer part rises toward the expansion ceiling at a speed set by uncertain parameters, so the
# shape of ARR inside 120 months does not follow from the structure alone.
modes = [{ var = "Customers", mode = "s-curve" }, { var = "customer share", mode = "s-curve" }]

[sectors]
"demand generation" = ["evaluation starts", "marketing driven starts", "word of mouth starts", "customer share", "detractor share",
                       "marketing reach rate", "marketing reach rate monthly", "word of mouth rate", "word of mouth rate monthly",
                       "negative word of mouth multiplier"]
"market pool" = ["Potential Customers", "Cooling Off Firms", "re entry", "cool off time", "Firms Yet To Enter",
                 "initial firms yet to enter", "market entries", "market growth rate", "market growth rate monthly",
                 "market growth horizon", "market growth active", "initial total market", "total market",
                 "initial cooling off firms"]
"sales pipeline" = ["Firms in Evaluation", "deal closings", "deals won", "deals lost", "sales cycle time", "sales capacity",
                    "initial sales capacity", "sales capacity growth rate", "initial firms in evaluation"]
"customer base" = ["Customers", "churn", "base annual churn rate", "base churn rate monthly", "effective churn fraction",
                   "Recently Churned Firms", "detractor fade", "detractor memory time", "initial customers",
                   "minimum customer base"]
"churn programme" = ["churn programme spend", "funded CS capacity", "CS cost per covered firm", "CS Capacity", "CS capacity change",
                     "CS ramp up time", "CS coverage", "CS effect", "coverage scale",
                     "churn reduction", "maximum churn reduction"]
"win-rate programme" = ["win rate programme spend", "target capability", "win spend scale", "Win Rate Capability",
                        "capability change", "enablement ramp up time", "base win rate", "maximum win rate uplift",
                        "effective win rate"]
"revenue" = ["ARR", "new ARR", "expansion ARR", "churned ARR", "new customer ACV", "base net expansion rate", "expansion lift",
             "expansion lift at full CS effect", "effective expansion rate", "effective expansion rate monthly",
             "ARR per customer", "expansion headroom", "expansion ceiling multiple",
             "revenue recognition", "Cumulative Revenue", "cumulative revenue net of programme spend"]
"budget" = ["total programme budget", "programme months", "monthly programme budget", "programme active", "phase switch month",
            "churn share phase 1", "churn share phase 2", "churn share now", "total programme spend", "Cumulative Programme Spend"]
"unit conversion" = ["months per year"]

[montecarlo]
n = 1000
seed = 20261029
metrics = [
  { name = "arr_m60", var = "ARR", stat = "value_at", time = 60 },
  { name = "arr_m120", var = "ARR", stat = "value_at", time = 120 },
  { name = "cum_revenue_m60", var = "Cumulative Revenue", stat = "value_at", time = 60 },
  { name = "net_cum_revenue_m60", var = "cumulative revenue net of programme spend", stat = "value_at", time = 60 },
  { name = "customers_m60", var = "Customers", stat = "value_at", time = 60 },
  { name = "customers_m120", var = "Customers", stat = "value_at", time = 120 },
  { name = "share_m60", var = "customer share", stat = "value_at", time = 60 },
  { name = "peak_evaluation_month", var = "evaluation starts", stat = "time_of_max" },
]

# Objective: ARR at month 60. "no programme" is listed FIRST: validate.py measures every gain per sample against the
# first policy, so gains are net comparisons against the unfunded baseline (gate 4 decision). The MC bands
# (mc_bands.csv) are therefore the no-programme world; funded bands come from separate runs at gate 8.
# Gate 7 condition (gate 5 decision): projects/saas-churn-vs-winrate/checks.py (regression vs bass-b2b-adoption and
# ARR identity) runs after engine/validate.py and must also exit 0. It appends its output to validation_report.md and,
# on failure, removes released results. summary.md and any explorer are withheld unless both exit 0.
[policy]
objective = "arr_m60"
maximize = true

[[policies]]
name = "no programme"
changes = { "total programme budget" = { set = 0 } }
[[policies]]
name = "churn first (months 0-24 churn, 24-60 win rate)"
changes = { "churn share phase 1" = { set = 1 }, "churn share phase 2" = { set = 0 } }
[[policies]]
name = "win rate first (months 0-24 win rate, 24-60 churn)"
changes = { "churn share phase 1" = { set = 0 }, "churn share phase 2" = { set = 1 } }
[[policies]]
name = "50/50 split"
[[policies]]
name = "churn only"
changes = { "churn share phase 1" = { set = 1 }, "churn share phase 2" = { set = 1 } }
[[policies]]
name = "win rate only"
changes = { "churn share phase 1" = { set = 0 }, "churn share phase 2" = { set = 0 } }

[[loops]]
name = "R1 word of mouth"
polarity = "R"
variables = ["deal closings", "deals won", "Customers", "customer share", "word of mouth starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "R2 lost-deal recycling via marketing"
polarity = "R"
variables = ["deals lost", "Cooling Off Firms", "re entry", "Potential Customers", "marketing driven starts", "evaluation starts", "Firms in Evaluation", "deal closings"]
[[loops]]
name = "R3 lost-deal recycling via word of mouth"
polarity = "R"
variables = ["deals lost", "Cooling Off Firms", "re entry", "Potential Customers", "word of mouth starts", "evaluation starts", "Firms in Evaluation", "deal closings"]
[[loops]]
name = "R4 churn recycling via marketing"
polarity = "R"
variables = ["deal closings", "deals won", "Customers", "churn", "Cooling Off Firms", "re entry", "Potential Customers", "marketing driven starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "R5 churn recycling via word of mouth"
polarity = "R"
variables = ["deal closings", "deals won", "Customers", "churn", "Cooling Off Firms", "re entry", "Potential Customers", "word of mouth starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "R6 expansion compounding"
polarity = "R"
variables = ["ARR", "expansion ARR"]
[[loops]]
name = "R7 CS dilution recycling via marketing"
polarity = "R"
variables = ["deal closings", "deals won", "Customers", "CS coverage", "CS effect", "churn reduction", "effective churn fraction", "churn", "Cooling Off Firms", "re entry", "Potential Customers", "marketing driven starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "R8 CS dilution recycling via word of mouth"
polarity = "R"
variables = ["deal closings", "deals won", "Customers", "CS coverage", "CS effect", "churn reduction", "effective churn fraction", "churn", "Cooling Off Firms", "re entry", "Potential Customers", "word of mouth starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "B1 saturation via word of mouth"
polarity = "B"
variables = ["Potential Customers", "word of mouth starts", "evaluation starts"]
[[loops]]
name = "B2 saturation via marketing"
polarity = "B"
variables = ["marketing driven starts", "evaluation starts", "Potential Customers"]
[[loops]]
name = "B3 churn"
polarity = "B"
variables = ["churn", "Customers"]
[[loops]]
name = "B4 pipeline drain (won)"
polarity = "B"
variables = ["deal closings", "deals won", "Firms in Evaluation"]
[[loops]]
name = "B5 pipeline drain (lost)"
polarity = "B"
variables = ["deals lost", "Firms in Evaluation", "deal closings"]
[[loops]]
name = "B6 cool-off drain"
polarity = "B"
variables = ["Cooling Off Firms", "re entry"]
[[loops]]
name = "B7 CS capacity adjustment"
polarity = "B"
variables = ["CS capacity change", "CS Capacity"]
[[loops]]
name = "B8 enablement adjustment"
polarity = "B"
variables = ["Win Rate Capability", "capability change"]
[[loops]]
name = "B9 detractor fade"
polarity = "B"
variables = ["detractor fade", "Recently Churned Firms"]
[[loops]]
name = "B10 ARR churn"
polarity = "B"
variables = ["churned ARR", "ARR"]
[[loops]]
name = "B11 CS dilution"
polarity = "B"
variables = ["effective churn fraction", "churn", "Customers", "CS coverage", "CS effect", "churn reduction"]
[[loops]]
name = "B12 negative word of mouth"
polarity = "B"
variables = ["deal closings", "deals won", "Customers", "churn", "Recently Churned Firms", "detractor share", "word of mouth starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "B13 negative word of mouth via CS dilution"
polarity = "B"
variables = ["deal closings", "deals won", "Customers", "CS coverage", "CS effect", "churn reduction", "effective churn fraction", "churn", "Recently Churned Firms", "detractor share", "word of mouth starts", "evaluation starts", "Firms in Evaluation"]
[[loops]]
name = "B14 expansion ceiling"
polarity = "B"
variables = ["ARR", "ARR per customer", "expansion headroom", "expansion ARR"]
