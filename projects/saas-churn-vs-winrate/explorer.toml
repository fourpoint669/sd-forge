# sd-explorer page settings. Generated by engine/explorer_config.py with defaults (no questions asked);
# edit and rebuild (python -I engine/build_explorer.py <project dir>) to change the page.
# Every name must exist in validation.toml: metrics in [montecarlo].metrics, variables in the model.

[decision]
metric = "arr_m60"
maximize = true
headline = ["arr_m60", "cum_revenue_m60", "net_cum_revenue_m60", "customers_m60"]

[[charts]]
id = "outcome"
kind = "outcome"
title = "ARR over time"
open = true
vars = ["ARR"]

[[charts]]
id = "key"
kind = "grid"
title = "Key outputs"
open = true
vars = ["Customers", "customer share", "Cumulative Revenue", "Firms in Evaluation", "evaluation starts"]

[[charts]]
id = "sector:market pool"
kind = "grid"
title = "market pool"
open = false
vars = ["Cooling Off Firms", "Firms Yet To Enter", "market entries", "Potential Customers", "re entry"]

[[charts]]
id = "sector:sales pipeline"
kind = "grid"
title = "sales pipeline"
open = false
vars = ["deals lost", "deals won"]

[[charts]]
id = "sector:customer base"
kind = "grid"
title = "customer base"
open = false
vars = ["churn", "detractor fade", "Recently Churned Firms"]

[[charts]]
id = "sector:churn programme"
kind = "grid"
title = "churn programme"
open = false
vars = ["CS Capacity", "CS capacity change"]

[[charts]]
id = "sector:win-rate programme"
kind = "grid"
title = "win-rate programme"
open = false
vars = ["capability change", "Win Rate Capability"]

[[charts]]
id = "sector:revenue"
kind = "grid"
title = "revenue"
open = false
vars = ["churned ARR", "expansion ARR", "new ARR", "revenue recognition"]

[[charts]]
id = "sector:budget"
kind = "grid"
title = "budget"
open = false
vars = ["Cumulative Programme Spend", "total programme spend"]
