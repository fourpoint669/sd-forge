# sd-explorer page settings. Generated by engine/explorer_config.py with defaults (no questions asked);
# edit and rebuild (python -I engine/build_explorer.py <project dir>) to change the page.
# Every name must exist in validation.toml: metrics in [montecarlo].metrics, variables in the model.

[decision]
metric = "customers_m60"
maximize = true
headline = ["customers_m60", "share_m60"]

[[charts]]
id = "outcome"
kind = "outcome"
title = "Customers over time"
vars = ["Customers"]

[[charts]]
id = "stocks"
kind = "grid"
title = "Stocks"
vars = ["Cooling Off Firms", "Potential Customers", "Firms in Evaluation", "Customers"]

[[charts]]
id = "flows"
kind = "grid"
title = "Flows"
vars = ["evaluation starts", "re entry", "deals lost", "deals won", "churn"]

[[charts]]
id = "outputs"
kind = "grid"
title = "Other key outputs"
vars = ["customer share"]
