# The gated run from the README, on every pull request and every push to main.
# Mirrors "Quick start" and the release command in README.md: a browser-required suite, so missing
# browser tooling fails the run instead of skipping it.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # PySD 3.14.3 support for newer Python is unverified (engine/requirements.txt).
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build the Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r engine/requirements.txt

      - name: Install Playwright and Chromium in the repository's parent folder
        # The parity gate and the browser tests resolve playwright from a folder above the
        # repository, exactly as README.md's prerequisites describe. The version is pinned so the
        # page engine is checked under one known Chromium.
        run: |
          cd ..
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: node can load Playwright from the repository
        run: node -e "require('playwright')"

      - name: Analytic archetype oracles
        run: .venv/bin/python -I engine/verify_archetypes.py

      - name: Repository, licence and explorer checks
        run: .venv/bin/python -I engine/check_repo.py --require-explorer

      - name: Documentation and PDF drift
        run: .venv/bin/python -I engine/build_docs.py --check

      - name: Test suite, browser required
        run: .venv/bin/python -I -m pytest engine/tests -q --require-browser
